<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Order Your Skin | Skinify</title>
  <meta name="description" content="Select your device, choose a skin design, enter your details and place your order on WhatsApp. Quick and easy checkout.">
  <link rel="canonical" href="/checkout">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <meta name="theme-color" content="#1B8C5C">
  <style>
    /* Checkout-specific: hide bottom nav, adjust padding */
    body { padding-bottom: 90px; }
    .bottom-nav { display: none; }
  </style>
</head>
<body>

  <main id="main-content">
    <div class="checkout-page" id="checkout-container">
      <!-- Populated by CheckoutFlow JS -->
    </div>
  </main>

  <script type="module">
    import { dataService } from '/assets/js/app.js';
    import { createHeader, createSearchOverlay } from '/assets/js/components.js';
    import { CheckoutFlow } from '/assets/js/checkout.js';

    // Insert header
    const header = createHeader({ showBack: true, showSearch: false, showCart: true });
    document.body.insertBefore(header, document.body.firstChild);

    // Search overlay
    const searchOverlay = createSearchOverlay(dataService);
    document.body.appendChild(searchOverlay);

    // Wire WhatsApp header
    const settings = await dataService.getSettings();
    const waBtn = document.getElementById('header-whatsapp-btn');
    if (waBtn) {
      waBtn.href = `https://wa.me/${settings.whatsappNumber}?text=${encodeURIComponent('Hi Skinify 👋')}`;
      waBtn.target = '_blank';
    }

    // Initialize checkout flow
    const container = document.getElementById('checkout-container');
    const checkout = new CheckoutFlow(container);
    window.skinifyCheckout = checkout; // For edit buttons in review step
    await checkout.init();
  </script>
</body>
</html>
